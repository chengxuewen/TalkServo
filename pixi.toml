# TalkServo pixi workspace — D11 (Linux-native-first; Docker = CI parity only).
# Shape per docs/modules/09 §3. Lockfile rule: pixi.lock committed alongside Cargo.lock (review O-§3).
[workspace]
name = "talkservo"
channels = ["https://conda.anaconda.org/conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

# Build chain for the mediasoup C++ worker (meson/ninja/clang) + node >= 22 for web/ Vite builds.
[dependencies]
rust = ">=1.85,<2"
cmake = ">=3.25"   # PolyOrch embed floor (plan-8 P1.0, D25)
python = "3.12.*"
nodejs = ">=22,<23"   # LTS band: conda nodejs 26 breaks jsdom (P2 lane lesson)
meson = "*"
ninja = "*"
clang = "*"
libclang = "*"
openssl = "*"
pkg-config = "*"
zlib = "*"
ripgrep = "*"
pyyaml = "*"
# mediasoup-sys build.rs drives the worker build through python "invoke" + pip
pip = "*"
invoke = "*"
requests = "*"

[feature.dev.tasks]
cmake-probe   = "cmake -B out/cmake-build -G Ninja"   # plan-8 P1 discoverability entry
check       = "cargo check --workspace"
build       = "cmake --build out/cmake-build --target talkservo-lanes-stub-build"   # plan-10: the aggregate replaced six enumerated lane names (and now carries ALL)
test        = 'ctest --test-dir out/cmake-build -L "rust|web"'   # P2 forwarder
gate        = "ctest --test-dir out/cmake-build -L gate"          # P3 forwarder: ledger+fmt+clippy+deny
e2e         = "ctest --test-dir out/cmake-build -L e2e-stub"       # P3 graph e2e entry (live: ctest -L e2e-live with env flags)
lint        = "cargo clippy --workspace --all-targets -- -D warnings"
test-sfu    = "TS_LANE_LIVE=1 ctest --test-dir out/cmake-build -L mediasoup"   # plan-10 T4: the live verb is in-graph; this is a forwarder
format      = "cargo fmt --all -- --check"
format-fix  = "cargo fmt --all"
# $CARGO_HOME/bin must be on PATH: cargo-deny is a user-installed subcommand and is
# otherwise invisible to the pixi env (the same gap cmake gate-deny used to have).
# /usr/bin:/bin too: the shell pixi spawns starts with a PATH so thin that cargo-deny's
# `git` (RustSec DB update) is not findable, which surfaces as "failed to spawn git".
audit       = "PATH=\"${CARGO_HOME:-$HOME/.cargo}/bin:/usr/bin:/bin:$PATH\" cargo deny check"
coverage    = "cargo tarpaulin --workspace --out Lcov"
# Both Node packages need provisioning per clone: `web` builds the SPA, and web/tsconfig also
# typechecks ../packages/client/src (tsc --noEmit reaches into the SDK), so a clone missing the
# SDK node_modules fails as: Cannot find module mediasoup-client (plan-10 drill, 2026-10-22).
client-install = "npm ci --prefix packages/client"
web-install = "npm ci --prefix web"
web-build   = "cmake --build out/cmake-build --target talkservo-web-build"   # P2 forwarder
web-test    = "ctest --test-dir out/cmake-build -L web"   # P2 forwarder
web-dev     = "npm run dev --prefix web"
run-server  = "cargo run -p talkservo-server"
run-coturn  = "docker compose -f docker/compose.yml up coturn"
issue-token = "bash scripts/issue-token.sh"
# mediasoup C++ subproject tarballs: build.rs wipes meson's packagecache after every successful
# worker build, and github/wrapdb are unreachable bare-direct on CN networks - re-seed it from
# the persistent staging dir before a cold live build (native-build-env-hardening).
worker-cache-restore = "bash scripts/worker-cache-restore.sh"

[feature.ci.tasks]
ci-check     = "cargo check --workspace"
# zero-backend workspace build fires the no-media compile_error — stub must be explicit (review H-3)
ci-check-mac = "cargo check --workspace --no-default-features --features talkservo-server/stub-media"
ci-lint      = "cargo clippy --workspace --all-targets -- -D warnings"
ci-test      = "cargo test --workspace"
ci-test-mediasoup = "cargo test -p talkservo-server --features sfu-mediasoup"

# MediaServo sister-PIT (MESON_ARGS unset trick): conda-injected MESON/MESON_ARGS buildtype
# clashes with meson setup → cryptic schema error in mediasoup-sys builds. Blank them so
# meson keeps its own defaults. See activation.env below for CC/CXX note.
# cc-rs needs a C compiler: conda env ships clang but no gcc — point CC/CXX at conda clang
# so the first build never depends on the host toolchain (D11 reproducibility).
[activation.env]
MESON = ""
MESON_ARGS = ""
NINJA = ""
CC = "$CONDA_PREFIX/bin/clang"
CXX = "$CONDA_PREFIX/bin/clang++-23"
LIBCLANG_PATH = "$CONDA_PREFIX/lib"
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig"
# conda-built build tools (flatc) need conda libstdc++ at RUNTIME — host /usr/lib has an older GLIBCXX
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[environments]
dev = ["dev"]
ci  = ["ci"]
