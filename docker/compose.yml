# TalkServo PoC deployment: server + coturn (modules/04/06).
# Secrets via env file — never committed (see config/sample.env for the full key set).
services:
  # Local-parity mode (default): mounts the host-built release binary — the
  # dev loop is native (D11); image build = CI lane (`--profile image`).
  server:
    image: ubuntu:22.04
    working_dir: /app
    volumes:
      - ../target/release/talkservo-server:/app/talkservo-server:ro
      - ../web/dist:/app/web/dist:ro
    environment:
      TS_JWT_SECRET: ${TS_JWT_SECRET:?set TS_JWT_SECRET in the env file}
      TS_BIND: 0.0.0.0:8080
    command: ["/app/talkservo-server"]
    ports:
      # host 18080 — 8080 is occupied by the sister project on this box
      - "18080:8080"
      - "34000-34100:40000-40100/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - coturn
    restart: unless-stopped

  # Full-image mode: docker compose --profile image up (CI artifact check)
  server-image:
    profiles: ["image"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TS_JWT_SECRET: ${TS_JWT_SECRET:?set TS_JWT_SECRET in the env file}
    ports:
      - "8081:8080"
    restart: unless-stopped

  coturn:
    # command-args mode (the stock image never auto-loads docker/coturn.yml;
    # compose interpolates TURN_SECRET here — the .yml stays for standalone
    # systemd hosts)
    image: coturn/coturn:latest
    network_mode: host
    command:
      # the image's binary is turnserver (entrypoint is `turnserver` —
      # overriding with `coturn` exits 127)
      - turnserver
      - -c
      - /dev/null
      - --listening-port=3478
      # masquerade: XOR-MAPPED-ADDRESS returns TEST-NET-3 (RFC5737 doc range)
      # instead of the box's own IP — on a single LAN host srflx would
      # otherwise equal host and Chrome dedups it (srflx candidate vanishes).
      # PROVES the STUN path end-to-end; the srflx pair never gets selected
      # (unreachable by design) — host leg still carries audio.
      - --relay-ip=192.168.2.127
      - --external-ip=203.0.113.77/192.168.2.127
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=talkservo
      - --min-port=40000
      - --max-port=40100
      - --fingerprint
      # dev/e2e only: the SFU sits on loopback peers (production deploys the
      # real network posture — modules/06). coturn bans RFC1918/loopback
      # peers by default and forwards nothing (measured rp=0).
      - --allow-loopback-peers
      - --log-file=stdout
      - -v
    restart: unless-stopped
