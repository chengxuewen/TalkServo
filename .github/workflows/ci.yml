# ─ INERT TODAY (D26, 2026-10-22) ────────────────────────────────────────────────
# This repository's only git remote is Gitee, so GitHub Actions never triggers the jobs
# below. The file is kept as the portable SPEC of what a clean-environment verification
# should run (graph lanes, dual-OS check, mediasoup feature test, cargo-deny), and it goes
# live the day a GitHub mirror exists. It is NOT evidence that verification is happening:
# what runs today is local — scripts/gate.sh via .githooks/pre-push, plus the pixi lanes
# (test / gate / e2e) as obligations on whoever pushes. See docs/architecture.md §4.
# ────────────────────────────────────────────────────────────────────────────────
name: ci

# plan-8 P4 verb switch: the Linux verification lanes run through the PolyOrch
# graph (ctest labels; entries build their own artifacts). fmt/clippy/test/web
# jobs folded into `graph`; macOS check, mediasoup feature tests, and cargo-deny
# audit stay cargo-direct (no graph equivalent for their verbs yet).
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  graph:
    # rust lanes + web lane + gate face (ledger greps, fmt, clippy, deny-skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl -fsSL https://pixi.sh/install | bash
      - run: npm ci --prefix packages/client
      - run: npm ci --prefix web
      - name: configure graph
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi run -e dev cmake -B out/ci-build -G Ninja -DTALKSERVO_PACKAGE_LANE=stub
      - name: test + gates
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi run -e dev ctest --test-dir out/ci-build -L "rust|web|gate"

  e2e:
    # stub-lane browser suite through the graph label (live lane stays manual:
    # TS_E2E_FEATURES=live + coturn, plan-8 P3 semantics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl -fsSL https://pixi.sh/install | bash
      - run: npm ci --prefix packages/client
      - run: npm ci --prefix web
      - run: cd web && npx playwright install --with-deps chromium
      - name: e2e via graph
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi run -e dev cmake -B out/e2e-build -G Ninja -DTALKSERVO_PACKAGE_LANE=stub >/dev/null
          pixi run -e dev ctest --test-dir out/e2e-build -L e2e-stub

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # mac has no mediasoup-capable backend -> stub path (review H-3: stub must be explicit)
      - run: cargo check --workspace --no-default-features --features talkservo-server/stub-media
        if: matrix.os == 'macos-latest'
      - run: cargo check --workspace
        if: matrix.os == 'ubuntu-latest'

  test-mediasoup:
    # mediasoup C++ worker builds on Linux x86_64 only (D6/D11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build libuv1-dev libssl-dev
      - run: cargo test -p talkservo-server --features sfu-mediasoup

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
