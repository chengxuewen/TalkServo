[package]
name = "talkservo-server"
description = "Signaling server binary: WS fan-out + SFU orchestration (mediasoup host) — PoC entry point"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "talkservo_server"
path = "src/lib.rs"

[[bin]]
name = "talkservo-server"
path = "src/main.rs"

[dependencies]
talkservo-core = { path = "../talkservo-core" }
talkservo-sfu = { path = "../talkservo-sfu", default-features = false }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
# D19: YAML instance config. The sister-proven 0.9 line was pinned "migrate to a
# maintained parser if cargo-deny flags it" - cargo-deny flagged it (RUSTSEC-2024-0449
# unsafe-libyaml, reached through serde_yaml's deprecated tree; no safe upgrade exists).
# serde-saphyr is pure safe Rust; only the two directions we use are compiled in.
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
jsonwebtoken.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
thiserror.workspace = true
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

[features]
default = ["sfu-mediasoup"]
sfu-mediasoup = ["talkservo-sfu/sfu-mediasoup"]
stub-media = ["talkservo-sfu/stub-media"]
embedded-web = ["dep:rust-embed", "dep:mime_guess"]

[dev-dependencies]
tokio-tungstenite.workspace = true
futures-util.workspace = true
