[package]
name = "talkservo-sfu"
description = "SFU host trait + backend selection: mediasoup (default, Linux) or stub (CI/mac) — exactly one active (modules/03)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
talkservo-core = { path = "../talkservo-core" }
tokio = { workspace = true, optional = true }
mediasoup = { workspace = true, optional = true }
mediasoup-types = { workspace = true, optional = true }

[features]
default = ["sfu-mediasoup"]
sfu-mediasoup = ["dep:mediasoup", "dep:mediasoup-types", "dep:tokio"]
stub-media = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
